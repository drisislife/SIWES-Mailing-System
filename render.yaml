services:
  - type: web
    name: council-workspace-system
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random key
      - key: PYTHON_VERSION
        value: "3.12.0"
